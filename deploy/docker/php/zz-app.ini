; =============================================================================
; @file zz-app.ini
; @path deploy/docker/php/zz-app.ini
; @project JS web-platform
; @author JS
; @created 2026
; @description PHP settings of the production image (on top of php.ini-production): upload
;   limits of the app, memory, OPcache for an immutable image.
; @note Uploads: 20 MB per file, 25 MB per request - Caddy allows 26 MB (Caddyfile) and the
;   app validates its own, smaller limits per upload profile (AttachmentPolicy).
; =============================================================================

upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = Europe/Prague

; The code never changes inside a running container (a release = a new image), so OPcache
; never re-checks the files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
