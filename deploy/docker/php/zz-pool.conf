; =============================================================================
; @file zz-pool.conf
; @path deploy/docker/php/zz-pool.conf
; @project JS web-platform
; @author JS
; @created 2026
; @description php-fpm pool of the production image: process count sized for the 512 MB limit
;   of the `app` container (deploy/compose.prod.yaml), ping for the healthcheck, environment of
;   the container passed to PHP (the settings come from env_file, not from a .env file).
; =============================================================================

[www]
listen = 9000
pm = dynamic
; ~40 MB per worker -> 10 workers stay under the 512 MB of the container.
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Healthcheck of the container (cgi-fcgi in api.Dockerfile). Reachable only inside the
; container network - Caddy sends every request to index.php, never to this path.
ping.path = /fpm-ping
ping.response = pong

; The Laravel settings are environment variables of the container (env_file) - keep them.
clear_env = no

; No access log (Caddy and the app log what is needed; an access log is personal data).
access.log = /dev/null
