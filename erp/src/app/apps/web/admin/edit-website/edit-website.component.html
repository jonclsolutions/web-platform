<!--
    @file: edit-website.component.html
    @path: /src/app/apps/web/admin/edit-website/edit-website.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Texts of the website: the shared translation editor page with the panels of
        the FAQ, the open positions and the references (extra tabs, created on their first open).
-->

<app-translation-editor-view [e]="this">
  @if (isTabOpened('faq')) {
    <div class="ew-titles-wrap" [style.display]="activeTab === 'faq' ? null : 'none'">
      <app-faq-editor [hostLanguages]="languages" (dirtyChange)="setTabDirty('faq', $event)"></app-faq-editor>
    </div>
  }

  @if (isTabOpened('jobs')) {
    <div class="ew-titles-wrap" [style.display]="activeTab === 'jobs' ? null : 'none'">
      <app-jobs-editor [hostLanguages]="languages" (dirtyChange)="setTabDirty('jobs', $event)"></app-jobs-editor>
    </div>
  }

  @if (isTabOpened('references')) {
    <div class="ew-titles-wrap" [style.display]="activeTab === 'references' ? null : 'none'">
      <app-references-editor [hostLanguages]="languages" (dirtyChange)="setTabDirty('references', $event)"></app-references-editor>
    </div>
  }
</app-translation-editor-view>
