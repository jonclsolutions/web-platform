<!--
    @file: web-welcome-page.component.html
    @path: /src/app/apps/web/admin/web-welcome-page/web-welcome-page.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description Landing page of the Web module - hero text describing the purpose of the
        section + a grid of quick links to the pages (gated by the same permission keys as
        the left menu of AdminLayoutComponent).
-->

<div class="wp-page">

  <div class="wp-welcome">
    <div class="wp-welcome-left">
      <h1 class="wp-welcome-title">{{ strings.header }}</h1>
    </div>
    <app-page-help></app-page-help>
  </div>

  <div class="wp-section-title">{{ strings.section_title }}</div>

  <div class="wp-cards-grid">
    @for (link of quickLinks; track link.route) {
      <a *appHasPermission="link.permission" [routerLink]="link.route" class="wp-link-card">
        <span class="wp-link-icon">
          @switch (link.icon) {
            @case ('edit-website') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
              </svg>
            }
            @case ('user-request') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
              </svg>
            }
            @case ('job-applications') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            }
            @case ('logs') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
            }
          }
        </span>
        <span class="wp-link-body">
          <span class="wp-link-title">{{ t(link.titleKey) }}</span>
          <span class="wp-link-desc">{{ t(link.descKey) }}</span>
        </span>
      </a>
    }
  </div>

</div>
