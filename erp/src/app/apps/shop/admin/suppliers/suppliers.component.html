<!-- 
    @file: suppliers.component.html
    @path: /src/app/apps/shop/admin/suppliers/suppliers.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026 
    @description: Template of the suppliers component.
-->
    
<div class="suppliers-container container mx-auto p-4">
  @if (errorMessage) {
    <div class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>
  }

  @if (!errorMessage) {
    <div>
      <app-page-header [title]="showTrashTable ? t('trash_header') : t('table_header')">
        <app-action-menu-builder
          [configs]="toolbarButtons"
          [triggerLabel]="t('toolbar_action_trigger')"
          (actionTriggered)="handleToolbarAction($event)">
        </app-action-menu-builder>
      </app-page-header>
      <div class="main-content-layout">
        <div class="filter-side-panel" [class.active]="isFilterVisible">
          <app-filter-form-builder
            [filterColumns]="filterColumns"
            [initialFilters]="filters"
            (closed)="toggleFilters()"
            (filtersApplied)="applyFilters($event)"
            (filtersCleared)="clearFilters()">
          </app-filter-form-builder>
        </div>
        <div class="table-and-pagination-container">
          @if (!showTrashTable) {
            <app-table-builder [footer]="tablePager" #activeTable
              [openOnRowClick]="true"
              (rowOpened)="openRecord($event)"
              [buttons]="buttons"
              [data]="data"
              [columns]="supplierColumns"
              [inputDefinitions]="formFields"
              [detailsColumns]="detailsColumns"
              [currentFilters]="filters"
              [isFullWidth]="isTableFullWidth"
              [lastUpdatedAt]="(activeLastUpdatedAt$ | async)"
(refreshRequested)="forceFullRefresh(filters)"
              [tableCaption]="tableCaption"
              [apiEndpoint]="apiEndpoint"
              [bulkDeleteEnabled]="true"
              (itemDeleted)="handleItemDeleted()"
              (createFormOpened)="handleCreateFormOpened()"
              (editFormOpened)="handleEditFormOpened($event)"
              (viewDetailsOpened)="handleViewDetails($event)">
            </app-table-builder>
          }
          @if (showTrashTable) {
            <app-trash-table-builder [footer]="tablePager"
              [data]="trashData"
              [columns]="trashSupplierColumns"
              [tableCaption]="t('trash_table_caption')"
              [apiEndpoint]="apiEndpoint"
              (itemRestored)="handleItemRestored()">
            </app-trash-table-builder>
          }
          <!-- Paging in the one-row footer of the table (and of the trash). -->
          <ng-template #tablePager>
            <app-pagination-buttons-builder layout="inline"
              [currentPage]="showTrashTable ? trashCurrentPage : currentPage"
              [totalPages]="showTrashTable ? trashTotalPages : totalPages"
              [totalItems]="showTrashTable ? trashTotalItems : totalItems"
              [itemsPerPage]="showTrashTable ? trashItemsPerPage : itemsPerPage"
              (pageChange)="handlePageChange($event)"
              (itemsPerPageChange)="handleItemsPerPageChange($event)">
            </app-pagination-buttons-builder>
          </ng-template>
        </div>
      </div>
    </div>
  }
</div>

@if (showCreateForm) {
  <app-form-builder #recordForm
    [recordMode]="!!recordItem"
    [detailColumns]="detailsColumns"
    [recordActions]="recordActions"
    (recordAction)="onRecordAction($event)"
    [inputDefinitions]="formFields"
    [formDataToEdit]="selectedItemForEdit"
    (formSubmitted)="handleFormSubmitted($event)"
    (formCanceled)="onCancelForm()">
  </app-form-builder>
}

@if (showDetails) {
  <app-details-builder
    [recordActions]="recordActions"
    (recordAction)="onRecordAction($event)"
    [itemDetailColumns]="detailsColumns"
    [inputDefinitions]="formFields"
    [itemData]="selectedItemForDetails"
    (closeDetails)="handleCloseDetails()">
  </app-details-builder>
}
@if (showGraphBuilder) {
<app-graph-builder
[apiEndpoint]="apiEndpoint"
[tableCaption]="tableCaption"
[columns]="graphColumns"
[dateField]="'created_at'"
[dateFieldLabel]="t('graph_date_field_label')"
(closed)="closeGraphBuilder()">
</app-graph-builder>
}
