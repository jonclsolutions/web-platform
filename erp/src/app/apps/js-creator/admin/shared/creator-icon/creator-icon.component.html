    @file: creator-icon.component.html
    @path: src/app/apps/js-creator/admin/shared/creator-icon/creator-icon.component.html

    @description: SVG of one icon of the set - each element of the list by its tag with its own
        attributes (stroke icon, colour = currentColor).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" [attr.width]="size" [attr.height]="size"
  fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth" stroke-linecap="round" stroke-linejoin="round"
  [attr.role]="label ? 'img' : null" [attr.aria-label]="label || null" [attr.aria-hidden]="label ? null : 'true'">
  @for (node of nodes; track $index) {
    @switch (node[0]) {
      @case ('path') { <svg:path [attr.d]="node[1]['d']" /> }
      @case ('circle') { <svg:circle [attr.cx]="node[1]['cx']" [attr.cy]="node[1]['cy']" [attr.r]="node[1]['r']" /> }
      @case ('line') { <svg:line [attr.x1]="node[1]['x1']" [attr.y1]="node[1]['y1']" [attr.x2]="node[1]['x2']" [attr.y2]="node[1]['y2']" /> }
      @case ('polyline') { <svg:polyline [attr.points]="node[1]['points']" /> }
      @case ('polygon') { <svg:polygon [attr.points]="node[1]['points']" /> }
      @case ('rect') { <svg:rect [attr.x]="node[1]['x']" [attr.y]="node[1]['y']" [attr.width]="node[1]['width']" [attr.height]="node[1]['height']" [attr.rx]="node[1]['rx']" [attr.ry]="node[1]['ry']" /> }
    }
  }
</svg>
