<!--
    @file: portal-maintenance.component.html
    @path: src/app/apps/project-portal/public/maintenance/portal-maintenance.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Maintenance page of the project portal - its texts and data passed to the one
        maintenance look (MaintenanceShellComponent): title, the text of the administrator (or the
        default text), the language switcher and the contacts of the site. No action button.
-->
<app-maintenance-shell
  [heading]="t('maintenance_title')"
  [text]="message || t('maintenance_text')"
  [languages]="languages"
  [currentLanguage]="currentLanguage"
  [languageLabel]="t('language_switcher_title')"
  (languageSelected)="selectLanguage($event)"
  [email]="email"
  [phone]="phone"
  [socialLinks]="socialLinks" />
