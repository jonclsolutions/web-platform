    @description: Maintenance page of the project portal: icon, title, the text of the
        administrator (or the default text), "Try again" and the language switcher.
-->
<div class="of-page">
  <div class="of-lang">
    <app-portal-language-switcher [label]="t('language_switcher_title')"></app-portal-language-switcher>
  </div>

  <main class="of-center">
    <section class="of-card pm-card" role="status">
      <div class="of-icon pm-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <h1 class="of-title">{{ t('maintenance_title') }}</h1>
      <p class="of-lead">{{ message || t('maintenance_text') }}</p>
      <button type="button" class="pm-retry" (click)="check()" [disabled]="checking">{{ t('maintenance_retry') }}</button>
    </section>
  </main>
</div>
