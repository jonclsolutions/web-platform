<!--
    @file: footer-language-switcher.component.html
    @path: src/app/shared/components/footer-language-switcher/footer-language-switcher.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Pill with the flag and name of the current language; the menu of the languages
      (flag, name, check of the active one) opens upwards. A missing or broken flag shows a globe.
      Hidden with a single language.
-->
@if (languages.length > 1) {
  <div class="fls" [class.fls--open]="isOpen" (keydown)="onKeydown($event)">
    <button #trigger class="fls-trigger" type="button" (click)="toggle()"
            [attr.aria-expanded]="isOpen" aria-haspopup="listbox" [attr.aria-label]="label || null"
            [attr.aria-controls]="isOpen ? menuId : null">
      @if (currentLanguage; as active) {
        @if (hasFlag(active)) {
          <img [src]="active.flag" alt="" class="fls-flag" (error)="flagFailed(active.code)">
        } @else {
          <svg class="fls-flag fls-globe" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        }
        <span class="fls-name" [attr.lang]="htmlLang(active.code)">{{ active.label }}</span>
      }
      <svg class="fls-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    @if (isOpen) {
      <ul class="fls-menu" role="listbox" [id]="menuId" [attr.aria-label]="label || null">
        @for (lang of languages; track lang.code; let i = $index) {
          <li #option class="fls-option" [class.fls-option--active]="lang.code === current" role="option"
              tabindex="-1" [attr.aria-selected]="lang.code === current" [attr.lang]="htmlLang(lang.code)"
              (click)="select(lang.code)" (keydown.enter)="select(lang.code); $event.preventDefault()"
              (keydown.space)="select(lang.code); $event.preventDefault()">
            @if (hasFlag(lang)) {
              <img [src]="lang.flag" alt="" class="fls-option-flag" (error)="flagFailed(lang.code)">
            } @else {
              <svg class="fls-option-flag fls-globe" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            }
            <span class="fls-option-label">{{ lang.label }}</span>
            @if (lang.code === current) {
              <svg class="fls-option-check" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
          </li>
        }
      </ul>
    }
  </div>
}
