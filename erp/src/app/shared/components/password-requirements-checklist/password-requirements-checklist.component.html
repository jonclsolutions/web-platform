    @refactor-note (2026-10-09): Requirement text is translated via `label(req)` (admin
        i18n section `password-policy`) instead of the hardcoded Czech `req.label`.
-->

<ul class="password-checklist">
  @for (req of requirements; track req.id) {
    <li class="password-checklist-item" [class.met]="isMet(req)">
      <span class="check-icon">
        @if (isMet(req)) {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        } @else {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
          </svg>
        }
      </span>
      {{ label(req) }}
    </li>
  }
</ul>
