<!--
    @file: maintenance-page.component.html
    @path: /src/app/public/shared/maintenance/maintenance-page.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Shared template of the web and e-shop maintenance pages - the texts and data of
        the module passed to the one maintenance look (MaintenanceShellComponent): the notice, the
        language switcher, contacts, social links and the admin sign-in link. No action button (the
        shell still offers an optional one - actionLabel / actionLink / action).
    @dependencies: BaseMaintenanceComponent (WebMaintenanceComponent, ShopMaintenanceComponent),
        MaintenanceShellComponent
-->
<app-maintenance-shell
  [heading]="t?.heading ?? ''"
  [text]="t?.text ?? ''"
  [note]="t?.sub_text ?? ''"
  [languages]="switcherLanguages"
  [currentLanguage]="currentLang"
  [languageLabel]="t?.language ?? ''"
  (languageSelected)="selectLanguage($event)"
  [email]="settings?.contact_email ?? ''"
  [phone]="settings?.contact_phone ?? ''"
  [socialLinks]="maintenanceSocialLinks"
  [adminLoginLabel]="t?.admin_login ?? ''" />
