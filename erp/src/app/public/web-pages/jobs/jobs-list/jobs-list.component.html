@if (t && settings) {
<div class="jobs-page">

  <section class="jobs-hero">
    <h1 class="jobs-hero-title">{{ t?.list_header_1 }}</h1>
    <p class="jobs-hero-sub">{{ t?.list_hero_sub }}</p>
  </section>

  <div class="jobs-body">
    <div class="jobs-list" role="list">
      @for (job of availableJobs; track job.id; let i = $index) {
        <a class="job-card" [routerLink]="['/jobs', job.id]" role="listitem">
          <span class="job-card-num" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <div class="job-card-body">
            <div class="job-card-title">{{ job?.title }}</div>
            <div class="job-card-desc">{{ job?.shortDescription }}</div>
          </div>
        </a>
      }
    </div>
  </div>
</div>
}
