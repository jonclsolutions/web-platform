<div class="catalog-container">

  <header class="catalog-header">
    <div class="title-group">
      <button class="filter-toggle" (click)="toggleFilters()" [class.active]="showFilters()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        <span>{{ t?.filter_button }}</span>
      </button>

      @if (showFilters()) {
        <div class="filter-bar-inline">
          <div class="filter-group">
            <div class="filter-item">
              <input type="text" [placeholder]="t?.search_placeholder" [(ngModel)]="filters.search" (keyup.enter)="applyFilters()">
            </div>
            <div class="filter-item">
              <select [(ngModel)]="filters.category_id" (change)="applyFilters()">
                <option value="">{{ t?.category_placeholder }}</option>
                @for (cat of categories(); track cat) {
                  <option [value]="cat.id">{{ cat.name }}</option>
                }
              </select>
            </div>
            <div class="filter-item">
              <select [(ngModel)]="filters.sort_by" (change)="applyFilters()">
                <option value="name">{{ t?.sort_name }}</option>
                <option value="price">{{ t?.sort_price }}</option>
                <option value="created_at">{{ t?.sort_newest }}</option>
              </select>
            </div>
            <div class="filter-item sort-dir">
              <select [(ngModel)]="filters.sort_direction" (change)="applyFilters()">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </div>
          </div>
        </div>
      }
    </div>
  </header>

  <div class="products-grid" [class.opacity-30]="isLoading()">
    @for (product of products(); track product) {
      <a [routerLink]="[config.ENDPOINTS.PRODUCT_DETAIL_BASE, product.slug]" class="product-card">
        <app-product-builder [product]="product"></app-product-builder>
      </a>
    }
  </div>

  @if (products().length === 0 && !isLoading()) {
    <div class="empty-state">
      <p>{{ t?.empty_state }}</p>
    </div>
  }

  @if (products().length > 0) {
    <div class="pagination-wrapper">
      <app-pagination-buttons-builder
        [currentPage]="filters.page"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)">
      </app-pagination-buttons-builder>
    </div>
  }

</div>
