<!--
    @file: password-dialog.component.html
    @path: src/app/admin/components/password-dialog/password-dialog.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Password prompt of the administration: header with close, description with a
        highlighted value, warning, password field, cancel / confirm.
-->
<div class="pwd-overlay" (click)="cancel()" (keydown.escape)="cancel()">
  <div class="pwd-card" role="dialog" aria-modal="true" aria-labelledby="pwd-title" (click)="$event.stopPropagation()">
    <form (ngSubmit)="submit()" autocomplete="off">
      <div class="pwd-header">
        <h2 class="pwd-title" id="pwd-title">{{ texts.title }}</h2>
        <button type="button" class="pwd-close" (click)="cancel()" [disabled]="busy" [attr.aria-label]="texts.close" [title]="texts.close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pwd-body">
        @if (texts.message || texts.highlight) {
          <p class="pwd-message">
            {{ texts.message }}
            @if (texts.highlight) {
              <strong class="pwd-highlight" [attr.data-tone]="texts.highlightTone">{{ texts.highlight }}</strong>
            }
          </p>
        }
        @if (texts.warning) {
          <div class="pwd-warning">{{ texts.warning }}</div>
        }
        <div class="pwd-field">
          <label for="pwd-password">{{ texts.label }}</label>
          <input #passwordInput id="pwd-password" class="pwd-input" type="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" maxlength="255" [(ngModel)]="password" [disabled]="busy"
                 [attr.aria-invalid]="error ? 'true' : null" [attr.aria-describedby]="error ? 'pwd-error' : null">
          @if (error) {
            <p class="pwd-error" id="pwd-error" role="alert">{{ error }}</p>
          }
        </div>
      </div>
      <div class="pwd-footer">
        <button type="button" class="pwd-btn pwd-btn--secondary" (click)="cancel()" [disabled]="busy">{{ texts.cancel }}</button>
        <button type="submit" class="pwd-btn pwd-btn--primary" [disabled]="busy || !password">{{ texts.confirm }}</button>
      </div>
    </form>
  </div>
</div>
