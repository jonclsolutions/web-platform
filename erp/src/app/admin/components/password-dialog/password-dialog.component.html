<!--
    @file: password-dialog.component.html
    @path: src/app/admin/components/password-dialog/password-dialog.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Password prompt of the administration in the shared popup frame
        (AdminModalComponent, prompt layer): description with a highlighted value, warning, password
        field; cancel / confirm in the footer (the confirm button submits the form by its id).
-->
<app-admin-modal size="sm" level="prompt" [heading]="texts.title" [closeDisabled]="busy" (dismissed)="cancel()">
  <form [id]="formId" (ngSubmit)="submit()" autocomplete="off">
    @if (texts.message || texts.highlight) {
      <p class="pwd-message">
        {{ texts.message }}
        @if (texts.highlight) {
          <strong class="pwd-highlight" [attr.data-tone]="texts.highlightTone">{{ texts.highlight }}</strong>
        }
      </p>
    }
    @if (texts.warning) {
      <div class="pwd-warning">{{ texts.warning }}</div>
    }
    <div class="pwd-field">
      <label [for]="inputId">{{ texts.label }}</label>
      <input #passwordInput [id]="inputId" class="pwd-input" type="password" name="password" placeholder="••••••••"
             autocomplete="current-password" maxlength="255" data-autofocus [(ngModel)]="password" [disabled]="busy"
             [attr.aria-invalid]="error ? 'true' : null" [attr.aria-describedby]="error ? errorId : null">
      @if (error) {
        <p class="pwd-error" [id]="errorId" role="alert">{{ error }}</p>
      }
    </div>
  </form>
  <ng-container modal-footer>
    <button type="button" class="am-btn am-btn--secondary" (click)="cancel()" [disabled]="busy">{{ texts.cancel }}</button>
    <button type="submit" class="am-btn am-btn--primary" [attr.form]="formId" [disabled]="busy || !password">{{ texts.confirm }}</button>
  </ng-container>
</app-admin-modal>
