@if (isVisible) {
  <div class="toast-wrapper">
    <div class="dialog-container" [ngClass]="getDialogClass()" (click)="ok()">
      <div class="dialog-icon">
        @switch (type) {
          @case ('success') {
            <span>✔️</span>
          }
          @case ('warning') {
            <span>⚠️</span>
          }
          @case ('danger') {
            <span>❌</span>
          }
          @case ('info') {
            <span>ℹ️</span>
          }
        }
      </div>
      <div class="dialog-content">
        <h2 class="dialog-title">{{ title || (type | titlecase) }}</h2>
        <p class="dialog-message">{{ message }}</p>
      </div>
      <button class="close-x-btn" (click)="closeClick(); $event.stopPropagation()">✕</button>
    </div>
  </div>
}
