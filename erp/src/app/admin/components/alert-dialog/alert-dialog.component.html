<div class="toast-wrapper">
  @for (toast of toasts; track toast.id) {
    <div
      class="dialog-container"
      [ngClass]="getDialogClass(toast.type)"
      [class.leaving]="toast.leaving"
      (click)="ok(toast.id)">
      <div class="dialog-icon">
        @switch (toast.type) {
          @case ('success') {
            <span>✔️</span>
          }
          @case ('warning') {
            <span>⚠️</span>
          }
          @case ('danger') {
            <span>❌</span>
          }
          @case ('info') {
            <span>ℹ️</span>
          }
        }
      </div>
      <div class="dialog-content">
        <h2 class="dialog-title">{{ toast.title || (toast.type | titlecase) }}</h2>
        <p class="dialog-message">{{ toast.message }}</p>
      </div>
      <button class="close-x-btn" (click)="closeClick(toast.id, $event)">✕</button>
    </div>
  }
</div>
