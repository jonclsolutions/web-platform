<!--
    @file: app-status-control.component.html
    @path: src/app/admin/components/app-status/app-status-control.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: State of an application (dot + text) and its maintenance switch (the
        confirmation is the shared password dialog).
-->
@if (visible) {
  <div class="as-control">
    @if (showState) {
      <span class="as-state as-state--{{ health }}" role="status">
        <span class="as-dot" aria-hidden="true"></span>
        {{ t('health_' + health) }}
      </span>
    }
    @if (status.canSwitch(appId)) {
      <button type="button" class="as-switch-btn" [class.as-switch-btn--on]="!active" (click)="open()">
        {{ active ? t('switch_off') : t('switch_on') }}
      </button>
    }
  </div>
}
