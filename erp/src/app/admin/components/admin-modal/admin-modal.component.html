<!--
    @file: admin-modal.component.html
    @path: /src/app/admin/components/admin-modal/admin-modal.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Frame of every admin popup: backdrop, card (dialog), header with the title,
        the optional subtitle, buttons (content marked `modal-header-actions`; hidden when empty)
        and the close button, the scrolling body (default content; `flush` - no padding, no own
        scrolling) and the footer (content marked `modal-footer`; hidden when empty).
    @dependencies: AdminModalComponent
-->
<div class="am-overlay" [attr.data-level]="level" [attr.data-size]="size"
     (mousedown)="onBackdropMousedown($event)" (click)="onBackdropClick($event)">
  <div #dialog class="am-card" [attr.data-size]="size" role="dialog" aria-modal="true" tabindex="-1"
       [attr.aria-labelledby]="headingId" [attr.aria-describedby]="subheading ? subheadingId : null">
    <header class="am-header">
      <div class="am-heading">
        <h2 class="am-title" [id]="headingId">{{ heading }}</h2>
        @if (subheading) {
          <p class="am-subtitle" [id]="subheadingId">{{ subheading }}</p>
        }
      </div>
      <div class="am-header-actions"><ng-content select="[modal-header-actions]" /></div>
      <button type="button" class="am-close" (click)="requestClose()" [disabled]="closeDisabled"
              [attr.aria-label]="closeLabel" [title]="closeLabel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="am-body" [class.am-body--flush]="flush"><ng-content /></div>
    <footer class="am-footer"><ng-content select="[modal-footer]" /></footer>
  </div>
</div>
