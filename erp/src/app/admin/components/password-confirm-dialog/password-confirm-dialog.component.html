<div class="dialog-overlay" (click)="cancel()" (keydown.escape)="cancel()">
  <div class="dialog-container" role="dialog" aria-modal="true" aria-labelledby="pwc-title" (click)="$event.stopPropagation()">
    <form (ngSubmit)="submit()" autocomplete="off">
      <div class="dialog-header">
        <h2 class="dialog-title" id="pwc-title">{{ texts.title }}</h2>
      </div>
      <div class="dialog-body">
        <p>{{ texts.message }}</p>
        <label class="pwc-label" for="pwc-password">{{ texts.label }}</label>
        <input #passwordInput id="pwc-password" class="pwc-input" type="password" name="password"
               autocomplete="current-password" maxlength="255" [(ngModel)]="password" [disabled]="busy"
               [attr.aria-invalid]="error ? 'true' : null" [attr.aria-describedby]="error ? 'pwc-error' : null">
        @if (error) {
          <p class="pwc-error" id="pwc-error" role="alert">{{ error }}</p>
        }
      </div>
      <div class="dialog-footer">
        <div class="dialog-actions">
          <button type="button" class="neutral_button" (click)="cancel()" [disabled]="busy">{{ texts.cancel }}</button>
          <button type="submit" class="confirm_button" [disabled]="busy || !password">{{ texts.confirm }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
