    @project: RPSW Web
    @author: RPSW

    @refactor-note (2026-08-25) BACKLOG "hledat napříč vším": přidán globální
        fulltextový input NAD sloupcovými filtry - vždy viditelný, nezávislý na
        `filterColumns` (na rozdíl od bloku pod ním, který se generuje z konfigurace
        dané stránky). Váže se na `filterForm[globalSearchKey]` (viz .ts,
        `globalSearchKey = 'search'`), Enter aplikuje filtry stejně jako u ostatních
        textových polí níže.
    @refactor-note (2026-08-25v2) Přidán `.filter-form-header` řádek (titulek + křížek
        vpravo nahoře) - `onClose()` emituje `closed`, rodičovská stránka na to naváže
        stejně, jako už dnes váže "Akce" dropdown na `toggleFilters()` (obě cesty
        zavírání fungují souběžně, žádná nenahrazuje druhou).
-->

<div class="filter-form-container">
  <div class="filter-form-header">
    <h3 class="filter-form-title">{{ filterFormTitle }}</h3>
    <button type="button" class="filter-form-close-btn" (click)="onClose()" aria-label="Zavřít filtr">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="filter-global-search">
    <label for="filterGlobalSearch" class="filter-label">Hledat ve všech sloupcích</label>
    <input
      type="search"
      id="filterGlobalSearch"
      [(ngModel)]="filterForm[globalSearchKey]"
      (keyup.enter)="applyFilters()"
      class="filter-input"
      placeholder="Zadejte hledaný výraz...">
  </div>

  <hr>

  <div class="filter-grid">
    @for (column of filterColumns; track column) {
      @if (column.type !== 'hidden') {
        <div>
          <label [for]="'filter' + column.key" class="filter-label">{{ column.header }}</label>
          
          @if (column.type === 'text' || column.type === 'email' || column.type === 'search' || column.type === 'number') {
            <input
              [type]="column.type"
              [id]="'filter' + column.key"
              [(ngModel)]="filterForm[column.key]"
              (keyup.enter)="applyFilters()"
              class="filter-input"
              [placeholder]="column.placeholder">
          }
          
          @if (column.type === 'select') {
            <select
              [id]="'filter' + column.key"
              [(ngModel)]="filterForm[column.key]"
              class="filter-select">
              <option value="">{{ column.placeholder }}</option>
              @for (option of $any(column.options); track option) {
                <option
                  [value]="option?.value !== undefined ? option.value : option">
                  {{ option?.label !== undefined ? option.label : option }}
                </option>
              }
            </select>
          }

          @if (column.type === 'checkbox') {
            <div class="filter-checkbox-wrapper">
              <input
                type="checkbox"
                [id]="'filter' + column.key"
                [(ngModel)]="filterForm[column.key]"
                (change)="applyFilters()"
                class="filter-checkbox">
            </div>
          }
        </div>
      }
    }
  </div>
  <hr>

  <div class="filter-grid">
    <div>
      <label for="filterSortBy" class="filter-label">Seřadit podle</label>
      <select id="filterSortBy" [(ngModel)]="sortBy" class="filter-select">
        <option value="">-- Vybrat sloupec --</option>
        @for (column of filterColumns; track column) {
          @if (column.canSort) {
            <option [value]="column.key">{{ column.header }}</option>
          }
        }
      </select>
    </div>
    <div>
      <label for="filterSortDirection" class="filter-label">Směr řazení</label>
      <select id="filterSortDirection" [(ngModel)]="sortDirection" class="filter-select">
        <option value="asc">Vzestupně (A-Z, od nejmenšího)</option>
        <option value="desc">Sestupně (Z-A, od největšího)</option>
      </select>
    </div>
  </div>

  <div class="filter-buttons-container">
    <button (click)="clearFilters()" class="filter-button clear">
      Vyčistit filtry
    </button>
    <button (click)="applyFilters()" class="filter-button apply">
      Použít filtry
    </button>
  </div>
</div>
