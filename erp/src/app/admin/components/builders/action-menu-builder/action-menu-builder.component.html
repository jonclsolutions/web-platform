<!--
    @file: action-menu-builder.component.html
    @path: /src/app/admin/components/builders/action-menu-builder/action-menu-builder.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @note: (click)="$event.stopPropagation()" on .action-menu-list is NOT needed - the
        HostListener in TS closes the menu only on a click OUTSIDE the host element
        (see onDocumentClick), so a click inside the list does not close it before
        onSelect() emits the action.
-->
<div class="action-menu">
  <!-- The main action of the page (`primaryAction`): "+ Přidat" next to the menu; on a phone a
       round green "+" (its name stays for the screen readers and as the tooltip). -->
  @if (primaryButton; as primary) {
    <button type="button" class="action-menu-primary" (click)="onSelect(primary.action)"
            [attr.aria-label]="primaryLabel" [attr.title]="primaryLabel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="action-menu-primary-label">{{ primaryLabel }}</span>
    </button>
  }

  <button
    #trigger
    type="button"
    class="action-menu-trigger"
    [class.active]="isOpen"
    (click)="toggleMenu()"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen"
    [attr.title]="attentionTitle">
    <span class="btn-icon">{{ triggerIcon }}</span>
    <span class="btn-label">{{ triggerLabel }}</span>
    <!-- An item needs attention (e.g. the e-mail lacks texts) - seen without opening the menu -->
    @if (attentionTitle; as hint) {
      <span class="action-menu-dot" aria-hidden="true"></span>
      <span class="action-menu-sr">{{ hint }}</span>
    }
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"
         [class.action-menu-chevron-open]="isOpen" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  @if (isOpen) {
    <div #menu class="action-menu-list"
         [style.top.px]="menuPosition?.top ?? 0"
         [style.left.px]="menuPosition?.left ?? 0"
         [style.visibility]="menuPosition ? 'visible' : 'hidden'">
      @for (btn of menuConfigs; track btn) {
        @if (btn.showIf !== false) {
          <button
            type="button"
            class="action-menu-item"
            [class.active]="btn.isActive"
            [attr.title]="btn.attention ? (btn.attentionTitle || null) : null"
            (click)="onSelect(btn.action)">
            @if (btn.icon) { <span class="btn-icon">{{ btn.icon }}</span> }
            <span class="btn-label">{{ btn.label }}</span>
            @if (btn.attention) {
              <span class="action-menu-dot" aria-hidden="true"></span>
              @if (btn.attentionTitle) { <span class="action-menu-sr">{{ btn.attentionTitle }}</span> }
            }
          </button>
        }
      }
    </div>
  }
</div>
