<!-- 
    @file: pagination-button-builder.component.html
    @path: /src/app/admin/components/builders/pagination-button-builder/pagination-button-builder.component.html
    @project: RPSW Web
    @author: RPSW
    @created: 2025
    @bugfix-note (2026-08-31): Rozsah "Zobrazuji X-Y z Z záznamů" nyní čte
        `rangeStart`/`rangeEnd` gettery (odvozené z currentPage/itemsPerPage/totalItems)
        místo dřívějšího přímého výpočtu z `dataLength` - viz
        pagination-buttons-builder.component.ts stejné datum. Přidána @if větev pro
        `totalItems === 0` (dřív se i u prázdné tabulky zobrazoval nesmyslný "1-0 z 0").
-->

<div class="pagination-controls-wrapper">
  <div class="pagination-info text-sm text-gray-700 p-b-10">
    @if (totalItems === 0) {
      Nebyly nalezeny žádné záznamy.
    } @else {
      Zobrazuji {{ rangeStart }} - {{ rangeEnd }} z celkem {{ totalItems }} záznamů.
    }
  </div>

  <div class="pagination-actions">
    <div class="items-per-page-container flex items-center space-x-2 pg-m p-b-10">
      <label for="itemsPerPage" class="text-sm text-gray-700">Položek na stránku:</label>
      <select id="itemsPerPage" (change)="onItemsPerPageSelect($event)"
        class="items-per-page-select" [ngModel]="itemsPerPage">
        <option [value]="5">5</option>
        <option [value]="10">10</option>
        <option [value]="15">15</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
      </select>
    </div>

    <nav class="pagination-nav" aria-label="Pagination Navigation">
      <button (click)="onPageClick(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="pagination-button nav-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      </button>

      @for (page of pagesArray; track page) {
        <button (click)="onPageClick(page)"
          [class.active-page]="page === currentPage"
          class="pagination-button">
          {{ page }}
        </button>
      }

      <button (click)="onPageClick(currentPage + 1)"
        [disabled]="currentPage === totalPages"
        class="pagination-button nav-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </button>
    </nav>
  </div>
</div>
