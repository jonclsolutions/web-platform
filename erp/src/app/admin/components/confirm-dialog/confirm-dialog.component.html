<!--
    @file: confirm-dialog.component.html
    @path: /src/app/admin/components/confirm-dialog/confirm-dialog.component.html
    @project: JS web-platform
    @author: JS
    @created: 2025
    @description: Template of the confirm dialog: the question in the shared admin popup frame
        (AdminModalComponent, prompt layer) with cancel / confirm; closing the frame cancels.
-->

@if (isVisible) {
  <app-admin-modal size="sm" level="prompt" [heading]="title" (dismissed)="cancel()">
    <p class="confirm-message">{{ message }}</p>
    <ng-container modal-footer>
      <button type="button" class="am-btn am-btn--secondary" (click)="cancel()">{{ cancelLabel }}</button>
      <button type="button" class="am-btn am-btn--primary" (click)="confirm()">{{ confirmLabel }}</button>
    </ng-container>
  </app-admin-modal>
}
