<div class="dashboard-container">
  <div class="header-box">
    <h1>Editovat veřejné texty</h1>
    <div class="lang-switcher">
      <button [class.active]="currentLang === 'cz'" (click)="loadLang('cz')" [disabled]="loadingService.isLoading$ | async">CZ</button>
      <button [class.active]="currentLang === 'en'" (click)="loadLang('en')" [disabled]="loadingService.isLoading$ | async">EN</button>
    </div>
  </div>

  <div class="editor-controls">
    <div class="search-group">
      <div class="input-container">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="applyFilter()"
          placeholder="Vyhledat klíč nebo text..."
          class="search-input">
        @if (searchQuery && searchQuery.length > 0) {
          <button class="reset-icon-btn" (click)="resetFilter()" type="button">✕</button>
        }
      </div>
      <button class="search-btn" (click)="applyFilter()">Vyhledat</button>
    </div>

    <button
      type="button"
      class="save-btn"
      (click)="onSubmit()"
      [disabled]="loadingService.isLoading$ | async">
      {{ (loadingService.isLoading$ | async) ? 'Ukládám...' : 'Uložit změny' }}
    </button>
  </div>

  <div class="table-wrapper" [class.loading-fade]="loadingService.isLoading$ | async">
    <table class="admin-table">
      <thead>
        <tr>
          <th style="width: 30%;">Klíč (JSON cesta)</th>
          <th style="width: 70%;">Hodnota (Text)</th>
        </tr>
      </thead>
      <tbody>
        @for (item of filteredKeys; track trackByPath($index, item)) {
          <tr>
            <td class="key-cell">
              <span class="key-text">{{ item.path }}</span>
            </td>
            <td class="edit-cell">
              <textarea
                [(ngModel)]="item.value"
                (ngModelChange)="updateValue(item.path, $event)"
                (input)="adjustHeight($event)"
                class="edit-input"
                rows="1"
                spellcheck="false">
              </textarea>
            </td>
          </tr>
        }
        @if (filteredKeys.length === 0 && !(loadingService.isLoading$ | async)) {
          <tr>
            <td colspan="2" class="empty-results">Žádné výsledky</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
