<div class="shipping-methods-container container mx-auto p-4">
  @if (errorMessage) {
    <div class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>
  }

  @if (!errorMessage) {
    <div>
      <div class="toolbar-actions m-b-t-5">
        <div class="table-header">Správa Způsobů Dopravy</div>
        <div class="toolbar-actions-in">
          <app-action-menu-builder
[configs]="toolbarButtons"
triggerLabel="Akce"
(actionTriggered)="handleToolbarAction($event)">
</app-action-menu-builder>
        </div>
      </div>
      <div class="main-content-layout">
        <div class="filter-side-panel" [class.active]="isFilterVisible">
          <app-filter-form-builder
            [filterColumns]="filterColumns"
            [initialFilters]="filters"
            (filtersApplied)="applyFilters($event)"
            (filtersCleared)="clearFilters()">
          </app-filter-form-builder>
        </div>
        <div class="table-and-pagination-container">
          @if (!showTrashTable) {
            <app-table-builder #activeTable
              [buttons]="buttons"
              [data]="data"
              [detailsColumns]="detailsColumns"
              [inputDefinitions]="formFields"
              [lastUpdatedAt]="(activeLastUpdatedAt$ | async)"
(refreshRequested)="forceFullRefresh(filters)"
              [columns]="shippingColumns"
              [currentFilters]="filters"
              [isFullWidth]="isTableFullWidth"
              [tableCaption]="'Seznam aktivních doprav'"
              [apiEndpoint]="apiEndpoint"
              (itemDeleted)="handleItemDeleted()"
              (createFormOpened)="handleCreateFormOpened()"
              (editFormOpened)="handleEditFormOpened($event)"
              (viewDetailsOpened)="handleViewDetails($event)">
            </app-table-builder>
          }
          @if (showTrashTable) {
            <app-trash-table-builder
              [data]="trashData"
              [columns]="trashShippingColumns"
              [tableCaption]="'Koš - smazané dopravy'"
              [apiEndpoint]="apiEndpoint"
              (itemRestored)="handleItemRestored()">
            </app-trash-table-builder>
          }
          <div class="flex justify-between items-center mt-4">
            <app-pagination-buttons-builder
              [currentPage]="showTrashTable ? trashCurrentPage : currentPage"
              [totalPages]="showTrashTable ? trashTotalPages : totalPages"
              [totalItems]="showTrashTable ? trashTotalItems : totalItems"
              [itemsPerPage]="showTrashTable ? trashItemsPerPage : itemsPerPage"
              [dataLength]="showTrashTable ? trashData.length : data.length"
              (pageChange)="handlePageChange($event)"
              (itemsPerPageChange)="handleItemsPerPageChange($event)">
            </app-pagination-buttons-builder>
          </div>
        </div>
      </div>
    </div>
  }
</div>

@if (showCreateForm) {
  <app-form-builder
    [inputDefinitions]="formFields"
    [formDataToEdit]="selectedItemForEdit"
    (formSubmitted)="handleFormSubmitted($event)"
    (formCanceled)="onCancelForm()">
  </app-form-builder>
}

@if (showDetails) {
  <app-details-builder
    [itemDetailColumns]="detailsColumns"
    [itemData]="selectedItemForDetails"
    [inputDefinitions]="formFields"
    (closeDetails)="handleCloseDetails()">
  </app-details-builder>
}
