<div class="kb-form-container">
  @if (!isSubmitted) {
    <div class="kb-form-header">
      <span class="doc-code">SUPPORT_TICKET_SYSTEM</span>
      <h1>{{ strings.title }}</h1>
      <p>{{ strings.lead }}</p>
    </div>
    <form [formGroup]="supportForm" (ngSubmit)="onSubmit()" class="kb-form-body">
      <div class="kb-form-row">
        <div class="form-group flex-1">
          <label>{{ strings.category_label }} <span class="req">*</span></label>
          <select formControlName="category">
            <option value="it">{{ strings.category_it }}</option>
            <option value="obchod">{{ strings.category_business }}</option>
            <option value="chyba">{{ strings.category_bug }}</option>
            <option value="ostatni">{{ strings.category_other }}</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label>{{ strings.priority_label }} <span class="req">*</span></label>
          <select formControlName="priority">
            <option value="low">{{ strings.priority_low }}</option>
            <option value="medium">{{ strings.priority_medium }}</option>
            <option value="high">{{ strings.priority_high }}</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>{{ strings.subject_label }} <span class="req">*</span></label>
        <input type="text" formControlName="subject" [placeholder]="strings.subject_placeholder">
      </div>
      <div class="form-group">
        <label>{{ strings.description_label }} <span class="req">*</span></label>
        <textarea formControlName="description" rows="4" [placeholder]="strings.description_placeholder"></textarea>
      </div>
      <div class="form-group">
        <label>{{ strings.attachment_label }}</label>
        <div class="kb-file-upload" [class.has-file]="selectedFile">
          <input type="file" (change)="onFileSelected($event)" id="file-input">
          <label for="file-input" class="file-label">
            <span class="file-icon">{{ selectedFile ? '✓' : '↑' }}</span>
            <span class="file-info">{{ selectedFile ? selectedFile.name : strings.file_placeholder }}</span>
          </label>
        </div>
      </div>
      <div class="kb-form-actions">
        <button type="submit" class="kb-btn-primary" [disabled]="supportForm.invalid || (loadingService.isLoading$ | async)">
          <span>
            @if ((loadingService.isLoading$ | async)) {
              {{ strings.submitting_button }}
            } @else {
              {{ strings.submit_button }}
            }
          </span>
        </button>
      </div>
    </form>
  } @else {
    <div class="kb-success-state">
      <div class="success-check">✓</div>
      <h2>{{ strings.success_title }}</h2>
      <p>{{ strings.success_message_prefix }} <strong>#{{ lastTicketId }}</strong></p>
      <button class="kb-btn-outline" (click)="isSubmitted = false; initForm(); selectedFile = null;">
        {{ strings.create_another_button }}
      </button>
    </div>
  }

</div>
