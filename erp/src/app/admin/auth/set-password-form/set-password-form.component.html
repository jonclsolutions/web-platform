<!--
    @file: set-password-form.component.html
    @path: src/app/admin/auth/set-password-form/set-password-form.component.html
    @project: JS web-platform
    @author: JS
    @created: 2026
    @description: Password + confirmation with visibility toggles, the live requirements
        checklist, the mismatch hint, the error of the form and the submit button.
    @note: autocomplete="new-password" lets password managers generate/save the value.
-->
<form (ngSubmit)="onSubmit()" novalidate>

  <div class="field-group">
    <label for="password">{{ t('label_password') }}</label>
    <div class="input-wrapper">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        [attr.minlength]="minLength"
        [attr.maxlength]="maxLength"
        autocomplete="new-password"
        [placeholder]="lengthPlaceholder"
      />
      <button
        type="button"
        class="visibility-toggle"
        (click)="showPassword = !showPassword"
        [attr.aria-label]="showPassword ? t('hide_password') : t('show_password')"
        tabindex="-1"
      >
        @if (!showPassword) {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.7 18.7 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        }
      </button>
    </div>

    <app-password-requirements-checklist [password]="password"></app-password-requirements-checklist>
  </div>

  <div class="field-group">
    <label for="passwordConfirmation">{{ t('label_confirmation') }}</label>
    <div class="input-wrapper">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>
      </svg>
      <input
        [type]="showPasswordConfirmation ? 'text' : 'password'"
        id="passwordConfirmation"
        name="passwordConfirmation"
        [(ngModel)]="passwordConfirmation"
        required
        [attr.minlength]="minLength"
        [attr.maxlength]="maxLength"
        autocomplete="new-password"
        [placeholder]="t('placeholder_confirmation')"
      />
      <button
        type="button"
        class="visibility-toggle"
        (click)="showPasswordConfirmation = !showPasswordConfirmation"
        [attr.aria-label]="showPasswordConfirmation ? t('hide_password') : t('show_password')"
        tabindex="-1"
      >
        @if (!showPasswordConfirmation) {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.7 18.7 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        }
      </button>
    </div>
    @if (passwordsMismatch) {
      <div class="field-error-text" role="alert">{{ t('error_mismatch') }}</div>
    }
  </div>

  @if (errorKey) {
    <div class="state-box state-box--error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ t(errorKey) }}</span>
    </div>
  }

  <!--
      @component: Submit button
      @description: Disabled until the password meets the shared policy and both
          fields match (`canSubmit`), so invalid input never reaches the API.
      @usage: [disabled]="!canSubmit"
  -->
  <button type="submit" class="submit-btn" [disabled]="!canSubmit">
    @if (submitting) { <span class="btn-spinner" aria-hidden="true"></span> }
    {{ submitting ? t('submitting') : t('submit') }}
  </button>
</form>
