  <style>
    /* Inline a mimo Angular záměrně — musí se zobrazit dřív, než se
       stáhne cokoliv dalšího (JS bundle, překlady, settings). Jakmile
       Angular vykreslí root komponentu do <app-root>, tenhle obsah
       se automaticky přepíše a spinner zmizí sám, bez JS zásahu. */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1b;
      z-index: 9999;
    }
    .initial-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(166, 125, 255, 0.2);
      border-top-color: #a67dff;
      border-radius: 50%;
      animation: initial-spin 0.7s linear infinite;
    }
    @keyframes initial-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .initial-spinner { animation: none; }
    }
  </style>

</head>
<body>
<app-root>
  <div id="initial-loader">
    <div class="initial-spinner"></div>
  </div>
</app-root>
</body>
