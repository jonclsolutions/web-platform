<style>
    /* Inline a mimo Angular záměrně — musí se zobrazit dřív, než se
       stáhne cokoliv dalšího (JS bundle, překlady, settings).
       @refactor-note (2026-08): Loader je teď SOUROZENEC <app-root>, ne jeho
       obsah. Uvnitř <app-root> by Angular přepsal (vyčistil) obsah hned při
       vložení AppComponent šablony — tedy hned po dokončení APP_INITIALIZERu,
       ne po skutečném vykreslení routované (lazy-loaded) stránky. Tím vznikala
       mezera "spinner zmizel, ale header/obsah ještě není hotový" (bílá
       stránka na moment). Skrytí teď řeší explicitně AppComponent přes
       ApplicationRef.isStable (viz app.component.ts), který čeká i na
       dokončení lazy-chunk importu a veškerých HTTP volání provedených
       uvnitř NgZone, ne jen na dokončení APP_INITIALIZERu. */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1b;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .initial-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(166, 125, 255, 0.2);
      border-top-color: #a67dff;
      border-radius: 50%;
      animation: initial-spin 0.7s linear infinite;
    }
    @keyframes initial-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .initial-spinner { animation: none; }
    }
</style>

</head>
<body>
<app-root></app-root>
<div id="initial-loader">
  <div class="initial-spinner"></div>
</div>
</body>
