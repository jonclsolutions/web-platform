<!-- 
    @file: index.html
    @path: /src/index.html
    @project: JS web-platform
    @author: JS
    @created: 2025
    @description: Host page of the Angular application (neutral meta tags, inline initial loader).
        Brand-specific SEO data come from the site settings at runtime (SeoService). The web
        fonts are self-hosted (src/fonts.css) - nothing is loaded from Google.
-->

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="">

<title>Loading</title>
<meta name="robots" content="index, follow">
<!-- description, author, canonical, og:* and the Organization JSON-LD are set at runtime from
     the site settings of this installation (SeoService) - nothing brand-specific here. -->
<meta property="og:type" content="website">

<style>
    /* Inline and outside Angular on purpose - the loader must show before anything else
       is downloaded (JS bundle, translations, settings). */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1b;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .initial-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(166, 125, 255, 0.2);
      border-top-color: #a67dff;
      border-radius: 50%;
      animation: initial-spin 0.7s linear infinite;
    }
    @keyframes initial-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .initial-spinner { animation: none; }
    }
</style>

</head>
<body>
<app-root></app-root>
<div id="initial-loader">
  <div class="initial-spinner"></div>
</div>
</body>
</html>
